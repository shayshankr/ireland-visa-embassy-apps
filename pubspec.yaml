name: ireland_visa_embassy
description: Ireland Visa Decision Checker — individual embassy app.
publish_to: 'none'
version: 1.0.3+35

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  provider: ^6.1.2
  url_launcher: ^6.3.0
  workmanager: ^0.9.0
  flutter_local_notifications: ^17.2.3
  shared_preferences: ^2.3.3
  share_plus: ^10.0.0
  in_app_review: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/newdelhi.png
    - assets/icons/beijing.png
    - assets/icons/abuja.png
    - assets/icons/abudhabi.png
    - assets/icons/ankara.png
